version: '3.9'
services:
  db:
    image: mongo:7
    container_name: synchro_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synchro_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      MONGO_URI: mongodb://db:27017/synchro
      JWT_SECRET: supersecretkey_change_in_production
      NODE_ENV: development
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synchro_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend

volumes:
  mongodata: